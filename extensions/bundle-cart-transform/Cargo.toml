[package]
name = "bundle_cart_transform"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shopify_function = { version = "0.8.0" }

[profile.release]
lto = true
opt-level = 'z'
strip = true
codegen-units = 1
panic = "abort"